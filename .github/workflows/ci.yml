name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r bot/requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Бот импортируется (без токена, только импорт)
        run: python -c "import squirtcar.bot"
        working-directory: bot

      - name: Тесты
        run: pytest
        working-directory: bot

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t squirtcar-bot bot

      - name: Образ запускается и просит токен
        run: |
          out=$(docker run --rm squirtcar-bot 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Не задан BOT_TOKEN"
